<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Gigs - FunaGig</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header class="navbar">
        <div class="brand">
            <div class="logo"></div> FunaGig
        </div>
    </header>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="title" style="display:flex; align-items:center; gap:10px;">
                <div class="cover-img" style="width:36px;height:36px;">TS</div> Tech Solutions Inc.
            </div>
            <nav class="navlist">
                <a class="navitem" href="business-dashboard.html">Dashboard</a>
                <a class="navitem" href="business-gigs.html">Post Gig</a>
                <a class="navitem active" href="posted-gigs.html">My Gigs</a>
                <a class="navitem" href="applicants.html">Applicants</a>
                <a class="navitem" href="business-analytics.html">Analytics</a>
                <a class="navitem" href="business-profile.html">Profile</a>
                <a class="navitem" href="#" onclick="Auth.logout(); return false;">Log out</a>
            </nav>
        </aside>
        <main class="content">
            <div class="section">
                <h1 class="h1">My Gigs</h1>
                <div id="gigs-list"></div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!Auth.isLoggedIn()) {
                window.location.href = 'auth.html';
                return;
            }

            const user = Auth.getUser();
            if (user) {
                const userName = user.name;
                const userInitials = userName.split(' ').map(n => n[0]).join('').toUpperCase();

                const sidebarTitle = document.querySelector('.sidebar .title');
                if (sidebarTitle) {
                    sidebarTitle.innerHTML = `<div class="cover-img" style="width:36px;height:36px;">${userInitials}</div> ${userName}`;
                }

                loadPostedGigs();
            }
        });

        async function loadPostedGigs() {
            try {
                const response = await apiFetch('/gigs/posted');
                if (response.success) {
                    renderGigs(response.gigs);
                }
            } catch (error) {
                console.error('Failed to load posted gigs:', error);
                showNotification('Failed to load your gigs', 'error');
            }
        }

        function renderGigs(gigs) {
            const gigsList = document.getElementById('gigs-list');
            if (gigs && gigs.length > 0) {
                gigsList.innerHTML = gigs.map(gig => `
                    <div class="card mb-10">
                        <h3>${gig.title}</h3>
                        <p>${gig.description}</p>
                        <p><strong>Budget:</strong> ${gig.budget}</p>
                        <p><strong>Status:</strong> ${gig.status}</p>
                    </div>
                `).join('');
            } else {
                gigsList.innerHTML = '<p>You have not posted any gigs yet.</p>';
            }
        }
    </script>
</body>

</html>
