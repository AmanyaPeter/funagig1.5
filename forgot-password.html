<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot Password - FunaGig</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header class="navbar">
        <div class="brand">
            <div class="logo"></div> FunaGig
        </div>
        <nav class="nav-actions">
            <a class="btn ghost" href="index.html">Home</a>
            <a class="btn" href="auth.html">Log In</a>
        </nav>
    </header>

    <main class="auth-wrap">
        <form class="card card-lg" id="forgot-password-form">
            <h1 class="h1" style="font-size:32px; text-align:center;">Forgot Password</h1>
            <p class="subtle mb-10" style="text-align:center;">Enter your email to reset your password</p>

            <div class="field">
                <label class="label">Email *</label>
                <input class="input" id="email" name="email" placeholder="Enter your email" required />
                <div class="error-message" id="emailError"></div>
            </div>

            <button type="submit" class="btn" style="width: 100%;">Send Reset Link</button>

            <div class="section mt-20" style="text-align:center;">
                <p class="subtle">Remember your password?
                    <a href="auth.html" style="color: var(--primary);">Log in</a>
                </p>
            </div>
        </form>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('forgot-password-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;

            apiFetch('/forgot-password', {
                method: 'POST',
                body: JSON.stringify({ email: email })
            }).then(response => {
                if (response.success) {
                    showNotification(response.message, 'success');
                    this.reset();
                } else {
                    showNotification(response.error || 'An error occurred', 'error');
                }
            });
        });
    </script>
</body>
</html>
